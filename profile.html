<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>마음 프리뷰</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                "Malgun Gothic",
                "Apple SD Gothic Neo",
                sans-serif;

            background: #fffdf5;
            color: #27231e;
        }

        .container {
            width: 100%;
            max-width: 760px;

            margin: 0 auto;
            padding: 25px 16px 60px;
        }

        .back-button {
            display: inline-block;

            margin-bottom: 20px;
            padding: 10px 16px;

            border: 2px solid #25211d;
            border-radius: 999px;

            background: white;
            color: #25211d;

            text-decoration: none;

            font-size: 14px;
            font-weight: 900;
        }

        .title-wrap {
            text-align: center;
            margin-bottom: 25px;
        }

        .title-highlight {
            display: inline-block;

            background: #ffe991;

            padding: 8px 22px;

            border-radius: 50%;

            transform: rotate(-2deg);

            margin-bottom: 10px;
        }

        h1 {
            margin: 0;

            font-size: 46px;
            line-height: 1.05;

            font-weight: 900;

            letter-spacing: -3px;

            transform: rotate(2deg);
        }

        .subtitle {
            margin-top: 13px;

            font-size: 18px;
            font-weight: 800;
        }

        .small-text {
            margin-top: 7px;

            color: #777067;

            font-size: 13px;
            line-height: 1.6;
        }

        .preview-card {
            background: white;

            padding: 12px;

            border: 3px solid #27231e;
            border-radius: 25px;

            margin-bottom: 28px;

            box-shadow:
                0 7px 0
                rgba(0, 0, 0, 0.06);
        }

        .preview-image {
            display: block;

            width: 100%;
            height: auto;

            border-radius: 17px;
        }

        .section {
            margin-bottom: 25px;

            background: white;

            border: 3px solid #27231e;
            border-radius: 25px;

            padding: 20px;

            box-shadow:
                0 7px 0
                rgba(0, 0, 0, 0.06);
        }

        .section-header {
            display: flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 20px;
        }

        .number {
            width: 47px;
            height: 47px;

            flex-shrink: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            font-size: 26px;
            font-weight: 900;

            border: 2px solid #27231e;
        }

        .number.green {
            background: #cee7b4;
        }

        .number.yellow {
            background: #ffe483;
        }

        .section-name {
            padding: 8px 16px;

            border-radius: 999px;

            font-size: 23px;
            font-weight: 900;
        }

        .green-title {
            background: #dcecc8;
        }

        .yellow-title {
            background: #fff0ac;
        }

        .section-description {
            margin-bottom: 18px;

            color: #6c655d;

            font-size: 13px;
            line-height: 1.6;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-weight: 900;

            font-size: 14px;
        }

        input[type="text"],
        input[type="number"],
        input[type="tel"],
        input[type="date"],
        textarea {
            width: 100%;

            padding: 13px 14px;

            border: 2px solid #302b26;
            border-radius: 13px;

            background: white;

            font-size: 16px;

            font-family: inherit;

            outline: none;
        }

        textarea {
            min-height: 130px;

            resize: vertical;

            line-height: 1.6;
        }

        input:focus,
        textarea:focus {
            border-color: #8aae71;

            box-shadow:
                0 0 0 3px
                rgba(138, 174, 113, 0.14);
        }

        .two-column {
            display: grid;

            grid-template-columns:
                1fr
                1fr;

            gap: 14px;
        }

        .choice-row {
            display: flex;

            gap: 10px;

            flex-wrap: wrap;
        }

        .choice {
            flex: 1;

            min-width: 90px;
        }

        .choice input {
            display: none;
        }

        .choice label {
            display: block;

            margin: 0;

            padding: 12px;

            border: 2px solid #27231e;
            border-radius: 13px;

            text-align: center;

            background: white;

            cursor: pointer;
        }

        .choice input:checked + label {
            background: #dcecc8;
        }

        .checkbox-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 10px;

            margin-bottom: 18px;
        }

        .check-item {
            border: 2px solid #27231e;

            border-radius: 13px;

            padding: 12px;

            background: white;

            cursor: pointer;

            font-weight: 800;
        }

        .check-item input {
            margin-right: 6px;

            transform: scale(1.2);
        }

        .privacy-note {
            background: #ffeeb0;

            padding: 13px 15px;

            border-radius: 16px;

            margin-top: 10px;

            font-size: 12px;

            color: #625b53;

            line-height: 1.7;
        }

        #saveButton {
            width: 100%;

            margin-top: 18px;

            padding: 17px 18px;

            border: 3px solid #27231e;
            border-radius: 999px;

            background: #ffd96e;

            color: #27231e;

            font-size: 21px;
            font-weight: 900;

            cursor: pointer;

            box-shadow:
                0 5px 0
                #d4ae39;
        }

        #saveButton:active {
            transform: translateY(2px);

            box-shadow:
                0 3px 0
                #d4ae39;
        }

        #savedMessage {
            display: none;

            margin-top: 15px;

            padding: 14px;

            background: #dcecc8;

            border-radius: 15px;

            text-align: center;

            font-weight: 900;
        }

        @media (max-width: 560px) {

            h1 {
                font-size: 38px;
            }

            .section-name {
                font-size: 19px;
            }

            .two-column {
                grid-template-columns:
                    1fr;
            }

            .checkbox-grid {
                grid-template-columns:
                    1fr;
            }

        }
    </style>
</head>


<body>

<div class="container">

    <a
        href="/"
        class="back-button"
    >
        ← 손금 페이지로
    </a>


    <div class="title-wrap">

        <div class="title-highlight">

            <h1>
                마음 프리뷰 ♡
            </h1>

        </div>

        <div class="subtitle">
            손끝에서 시작하는 자기 이해
        </div>

        <div class="small-text">
            손금을 본 뒤 떠오른 생각을
            천천히 적어보세요.
        </div>

    </div>


    <!-- 마음 프리뷰 이미지 -->

    <div class="preview-card">

        <img
            src="/mind-preview.png"
            alt="마음 프리뷰 안내"
            class="preview-image"
        >

    </div>


    <!-- 1 기본 정보 -->

    <section class="section">

        <div class="section-header">

            <div class="number green">
                1
            </div>

            <div
                class="
                    section-name
                    green-title
                "
            >
                기본 정보
            </div>

        </div>


        <div class="section-description">
            손금 결과를 돌아보기 전에
            기본 정보를 입력해주세요.
        </div>


        <div class="field">

            <label for="name">
                성명
            </label>

            <input
                type="text"
                id="name"
                placeholder="이름을 입력해주세요"
            >

        </div>


        <div class="field">

            <label>
                성별
            </label>

            <div class="choice-row">

                <div class="choice">

                    <input
                        type="radio"
                        id="male"
                        name="gender"
                        value="남"
                    >

                    <label for="male">
                        남
                    </label>

                </div>

                <div class="choice">

                    <input
                        type="radio"
                        id="female"
                        name="gender"
                        value="여"
                    >

                    <label for="female">
                        여
                    </label>

                </div>

                <div class="choice">

                    <input
                        type="radio"
                        id="other"
                        name="gender"
                        value="기타"
                    >

                    <label for="other">
                        기타
                    </label>

                </div>

            </div>

        </div>


        <div class="two-column">

            <div class="field">

                <label for="age">
                    연령
                </label>

                <input
                    type="number"
                    id="age"
                    min="1"
                    max="120"
                    placeholder="예: 25"
                >

            </div>

            <div class="field">

                <label for="date">
                    작성일
                </label>

                <input
                    type="date"
                    id="date"
                >

            </div>

        </div>


        <div class="field">

            <label for="contact">
                연락처 (선택)
            </label>

            <input
                type="tel"
                id="contact"
                placeholder="필요한 경우에만 입력해주세요"
            >

        </div>


        <div class="privacy-note">

            🔒 현재 입력 내용은 서버나 데이터베이스에 저장하지 않고
            이 기기의 브라우저에만 임시 저장합니다.
            연락처가 필요하지 않다면 비워두어도 됩니다.

        </div>

    </section>


    <!-- 2 손금에서 떠오른 나 -->

    <section class="section">

        <div class="section-header">

            <div class="number yellow">
                2
            </div>

            <div
                class="
                    section-name
                    yellow-title
                "
            >
                손금에서 떠오른 나
            </div>

        </div>


        <div class="section-description">

            오늘 손금 결과를 보면서
            가장 생각해보게 된 것은 무엇인가요?
            여러 개 선택해도 괜찮아요.

        </div>


        <div class="checkbox-grid">

            <label class="check-item">

                <input
                    type="checkbox"
                    value="나의 성향"
                    name="topics"
                >

                나의 성향

            </label>


            <label class="check-item">

                <input
                    type="checkbox"
                    value="감정·관계"
                    name="topics"
                >

                감정 · 관계

            </label>


            <label class="check-item">

                <input
                    type="checkbox"
                    value="현재의 고민"
                    name="topics"
                >

                현재의 고민

            </label>


            <label class="check-item">

                <input
                    type="checkbox"
                    value="진로·미래"
                    name="topics"
                >

                진로 · 미래

            </label>


            <label class="check-item">

                <input
                    type="checkbox"
                    value="삶의 방향"
                    name="topics"
                >

                삶의 방향

            </label>


            <label class="check-item">

                <input
                    type="checkbox"
                    value="기타"
                    name="topics"
                >

                기타

            </label>

        </div>


        <div class="field">

            <label for="reason">
                그렇게 생각한 이유는 무엇인가요?
            </label>

            <textarea
                id="reason"
                placeholder="손금 결과를 보며 떠오른 생각을 자유롭게 적어주세요."
            ></textarea>

        </div>

    </section>


    <button id="saveButton">

        💛 여기까지 저장하기

    </button>


    <div id="savedMessage">

        입력한 내용을 저장했어요 👍

    </div>

</div>


<script>

    const nameInput =
        document.getElementById(
            "name"
        );

    const ageInput =
        document.getElementById(
            "age"
        );

    const contactInput =
        document.getElementById(
            "contact"
        );

    const dateInput =
        document.getElementById(
            "date"
        );

    const reasonInput =
        document.getElementById(
            "reason"
        );

    const saveButton =
        document.getElementById(
            "saveButton"
        );

    const savedMessage =
        document.getElementById(
            "savedMessage"
        );


    /* 오늘 날짜 */

    const now =
        new Date();

    const localToday =
        [
            now.getFullYear(),

            String(
                now.getMonth() + 1
            ).padStart(2, "0"),

            String(
                now.getDate()
            ).padStart(2, "0")
        ]
        .join("-");

    dateInput.value =
        localToday;


    /* 기존 저장 내용 불러오기 */

    const saved =
        localStorage.getItem(
            "palmProfile"
        );


    if (saved) {

        try {

            const data =
                JSON.parse(
                    saved
                );


            nameInput.value =
                data.name || "";


            ageInput.value =
                data.age || "";


            contactInput.value =
                data.contact || "";


            dateInput.value =
                data.date || localToday;


            reasonInput.value =
                data.reason || "";


            if (data.gender) {

                const gender =
                    document.querySelector(
                        `input[name="gender"][value="${data.gender}"]`
                    );


                if (gender) {

                    gender.checked =
                        true;

                }

            }


            if (
                Array.isArray(
                    data.topics
                )
            ) {

                const checks =
                    document.querySelectorAll(
                        'input[name="topics"]'
                    );


                checks.forEach(
                    function (checkbox) {

                        if (
                            data.topics.includes(
                                checkbox.value
                            )
                        ) {

                            checkbox.checked =
                                true;

                        }

                    }
                );

            }

        } catch (error) {

            console.log(
                "저장된 정보 읽기 실패",
                error
            );

        }

    }


    /* 저장 */

    saveButton.addEventListener(
        "click",
        function () {

            const gender =
                document.querySelector(
                    'input[name="gender"]:checked'
                );


            if (
                !nameInput.value.trim()
            ) {

                alert(
                    "성명을 입력해주세요."
                );

                return;

            }


            if (!gender) {

                alert(
                    "성별을 선택해주세요."
                );

                return;

            }


            if (
                !ageInput.value
            ) {

                alert(
                    "연령을 입력해주세요."
                );

                return;

            }


            const selectedTopics =
                Array.from(
                    document.querySelectorAll(
                        'input[name="topics"]:checked'
                    )
                )
                .map(
                    checkbox =>
                        checkbox.value
                );


            const profileData = {

                name:
                    nameInput.value.trim(),

                gender:
                    gender.value,

                age:
                    ageInput.value,

                contact:
                    contactInput.value.trim(),

                date:
                    dateInput.value,

                topics:
                    selectedTopics,

                reason:
                    reasonInput.value.trim()

            };


            localStorage.setItem(
                "palmProfile",
                JSON.stringify(
                    profileData
                )
            );


            savedMessage.style.display =
                "block";


            setTimeout(
                function () {

                    savedMessage.style.display =
                        "none";

                },
                2500
            );

        }
    );

</script>

</body>

</html>
